name: CodeQL

"on":
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    env:
      # Pinned action source supports this opt-out of database caching.
      CODEQL_OVERLAY_DATABASE_MODE: none

    steps:
      - name: Reject debug runs that could upload source databases
        shell: python {0}
        run: |
          import os

          if os.environ.get("RUNNER_DEBUG") == "1" or os.environ.get("ACTIONS_STEP_DEBUG", "").lower() == "true":
              raise SystemExit("Disable Actions debug logging before running this source-only analysis.")

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: linked
          queries: security-extended
          debug: false
          trap-caching: false
          dependency-caching: false
          config: |
            paths:
              - src
              - npm
              - tools
              - tests

      # Interpreted-language extraction: no install, build or repository script.
      - name: Analyze and upload code-scanning results
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: always
          upload-database: false
          wait-for-processing: true
