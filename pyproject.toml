[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "decision-mesh"
version = "0.1.0a1"
description = "Evidence-aware local decision observations and notifications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5", "Flask==3.1.3", "waitress==3.0.2", "keyring==25.7.0", "httpx==0.28.1", "httpcore==1.0.9", "h11==0.16.0"]

[project.urls]
Repository = "https://github.com/UniversalWinner/DecisionMesh"
Issues = "https://github.com/UniversalWinner/DecisionMesh/issues"

[project.scripts]
decisionmesh = "decision_mesh.cli:main"
decisionmesh-capture = "decision_mesh.adapters.codex:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.sdist]
include = ["/src/decision_mesh", "/pyproject.toml", "/LICENSE", "/README.md", "/SECURITY.md", "/CONTRIBUTING.md", "/VISION.md", "/docs/public"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.wheel]
packages = ["src/decision_mesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
